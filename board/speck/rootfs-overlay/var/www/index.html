<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeckOS Workspace</title>
    <link rel="stylesheet" href="desktop.css">
    <style>
        .speck-window { display: none; position: absolute; top: 15%; left: 20%; width: 60%; height: 60%; background: #161920; border: 2px solid #00ffcc; box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-direction: column; z-index: 100; }
        .window-header { background: #222733; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00ffcc; font-size: 14px; }
        .close-btn { color: #ff0055; cursor: pointer; font-weight: bold; }
        .window-body { flex-grow: 1; padding: 10px; display: flex; flex-direction: column; }
        #editor-textarea { width: 100%; height: 100%; background: #0d0e11; color: #00ffcc; border: 1px solid #333; padding: 10px; font-family: 'Courier New', monospace; resize: none; outline: none; }
        .save-bar { padding-top: 10px; text-align: right; }
        .system-btn { background: #0d0e11; color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 15px; cursor: pointer; font-family: 'Courier New', monospace; }
        .system-btn:hover { background: #00ffcc; color: #0d0e11; }
    </style>
</head>
<body>

    <!-- App desktop interface launcher grid -->
    <div id="desktop-grid">
        <div class="app-icon" onclick="launchSpeckApp('SpeckWrite')">
            <div class="icon-symbol">📝</div>
            <div class="icon-name">SpeckWrite</div>
        </div>
        <div class="app-icon" onclick="launchSpeckApp('FileCore')">
            <div class="icon-symbol">📁</div>
            <div class="icon-name">FileCore</div>
        </div>
        <!-- 🧮 Calculator Icon -->
        <div class="app-icon" onclick="launchSpeckApp('SpeckCalc')">
            <div class="icon-symbol">🧮</div>
            <div class="icon-name">SpeckCalc</div>
        </div>
        <!-- 📟 Console Terminal Icon -->
        <div class="app-icon" onclick="launchSpeckApp('SpeckTerm')">
            <div class="icon-symbol">📟</div>
            <div class="icon-name">SpeckTerm</div>
        </div>
        <!-- 🤖 Agent Tool Icon -->
        <div class="app-icon" onclick="runSpeckAgentNode('maintenance')">
            <div class="icon-symbol" style="color: #a855f7;">🤖</div>
            <div class="icon-name">SpeckAgent</div>
        </div>
        <!-- 📩 Support Feedback Icon -->
        <div class="app-icon" onclick="runSpeckAgentNode('complaints')">
            <div class="icon-symbol" style="color: #eab308;">📩</div>
            <div class="icon-name">File Bug</div>
        </div>
    </div>

    <!-- 📝 TEXT EDITOR WINDOW -->
    <div id="write-window" class="speck-window">
        <div class="window-header">
            <span id="window-title">SpeckWrite - welcome.txt</span>
            <span class="close-btn" onclick="closeWindow('write-window')">[X]</span>
        </div>
        <div class="window-body">
            <textarea id="editor-textarea"></textarea>
            <div class="save-bar">
                <button class="system-btn" onclick="saveActiveDocument()">Save to Stick</button>
            </div>
        </div>
    </div>

    <div id="taskbar" style="position: absolute; bottom: 0; width: 100%; height: 40px; background: #161920; border-top: 2px solid #00ffcc; display: flex; align-items: center; padding-left: 15px;">
        <span class="logo" style="font-weight: bold; color: #00ffcc; font-size: 14px;">● SpeckOS Desktop Environment</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
